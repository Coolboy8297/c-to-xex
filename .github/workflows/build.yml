name: Build Xbox 360 Homebrew

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: free60/libxenon:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build XexTool from source
        run: |
          apt-get update
          apt-get install -y --no-install-recommends cmake g++ git ca-certificates

          echo "Cloning XexTool and its required submodules..."
          git clone --depth 1 --recurse-submodules https://github.com/Team-Resurgent/XexTool.git /tmp/XexTool

          echo "Configuring XexTool..."
          cmake -S /tmp/XexTool -B /tmp/XexTool/build -DCMAKE_BUILD_TYPE=Release

          echo "Compiling XexTool..."
          cmake --build /tmp/XexTool/build --config Release --parallel 2

          echo "Testing XexTool..."
          ctest --test-dir /tmp/XexTool/build --output-on-failure

          echo "/tmp/XexTool/build" >> "$GITHUB_PATH"

      - name: Build Xbox 360 program
        run: |
          export DEVKITXENON=/usr/local/xenon
          export PATH="$DEVKITXENON/bin:$DEVKITXENON/usr/bin:$PATH"

          echo "Cleaning previous build..."
          make clean || true

          echo "Compiling project..."
          make

          echo "Attempting ELF-to-XEX packing..."
          make xex

          echo "Available build outputs:"
          find . -maxdepth 3 -type f \
            \( -name '*.elf' -o -name '*.elf32' -o -name '*.xex' \) \
            -print

      - name: Upload Xbox 360 build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xbox360-homebrew
          path: |
            **/*.elf
            **/*.elf32
            **/*.xex
          if-no-files-found: error
