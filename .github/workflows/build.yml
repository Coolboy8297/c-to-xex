name: Build Xbox 360 Homebrew

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: free60/libxenon:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify native LibXenon XEX converter
        shell: bash
        run: |
          set -euo pipefail
          export DEVKITXENON=/usr/local/xenon
          export PATH="$DEVKITXENON/bin:$DEVKITXENON/usr/bin:$PATH"
          command -v xenon-elf2xex

      - name: Build and package
        shell: bash
        run: |
          set -euo pipefail
          export DEVKITXENON=/usr/local/xenon
          export PATH="$DEVKITXENON/bin:$DEVKITXENON/usr/bin:$PATH"
          make clean
          make
          test -s "./$(basename "$PWD").elf32"
          make xex
          test -s "./$(basename "$PWD").xex"
          file "./$(basename "$PWD").xex" || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xbox360-homebrew
          path: |
            **/*.elf
            **/*.elf32
            **/*.xex
          if-no-files-found: error
