name: Build Xbox 360 ELF32

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: free60/libxenon:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Xbox 360 linker layout
        shell: bash
        run: |
          set -euo pipefail
          export DEVKITXENON=/usr/local/xenon
          export PATH="$DEVKITXENON/bin:$DEVKITXENON/usr/bin:$PATH"
          sed -e 's|0x80000000|0x82000000|g' \
              -e 's|0x9E000000|0xA0000000|g' \
              -e 's|0xa0000000|0xA2000000|g' \
              "$DEVKITXENON/app.lds" > /tmp/veyaora-app.lds
          cp /tmp/veyaora-app.lds "$DEVKITXENON/app.lds"

      - name: Build and validate ELF32
        shell: bash
        run: |
          set -euo pipefail
          export DEVKITXENON=/usr/local/xenon
          export PATH="$DEVKITXENON/bin:$DEVKITXENON/usr/bin:$PATH"
          make clean
          make
          ELF32="./$(basename "$PWD").elf32"
          test -s "$ELF32"
          file "$ELF32"
          python3 - "$ELF32" <<'PY'
          import struct, sys
          path = sys.argv[1]
          with open(path, "rb") as f:
              data = f.read(64)
          if data[:4] != b"\\x7fELF":
              raise SystemExit("ERROR: output is not an ELF file")
          if data[4] != 1:
              raise SystemExit("ERROR: output is not ELF32 (EI_CLASS != ELFCLASS32)")
          if data[5] != 2:
              raise SystemExit("ERROR: expected big-endian ELF for Xbox 360 PowerPC")
          machine = struct.unpack(">H", data[18:20])[0]
          if machine != 20:
              raise SystemExit(f"ERROR: expected PowerPC ELF (e_machine=20), got {machine}")
          entry = struct.unpack(">I", data[24:28])[0]
          print(f"Validated big-endian PowerPC ELF32; entry point: 0x{entry:08X}")
          if entry < 0x80000000:
              raise SystemExit("ERROR: ELF entry point is below the Xbox 360 kernel address range")
          PY
          mkdir -p release-files
          cp "$ELF32" release-files/xbox360-homebrew.elf32
          cd release-files
          sha256sum * > SHA256SUMS.txt

      - name: Upload ELF32 build artifact
        uses: actions/upload-artifact@v4
        with:
          name: xbox360-elf32
          path: release-files/*
          if-no-files-found: error

      - name: Publish ELF32 direct download
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: Latest Xbox 360 ELF32
          body: Automatically built as big-endian PowerPC ELF32 for Xbox 360 homebrew. This is an ELF32 executable, not an XEX.
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: release-files/*
