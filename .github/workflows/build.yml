name: Build Xbox 360 Homebrew

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: free60/libxenon:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Xbox 360 program
        shell: bash
        run: |
          set -euo pipefail
          export DEVKITXENON=/usr/local/xenon
          export PATH="$DEVKITXENON/bin:$DEVKITXENON/usr/bin:$PATH"

          echo "Checking libxenon ELF-to-XEX converter..."
          command -v xenon-elf2xex

          echo "Cleaning previous build..."
          make clean

          echo "Compiling VEYAORA homebrew..."
          make

          echo "Converting libxenon ELF to XEX..."
          make xex

          echo "Available build outputs:"
          find . -maxdepth 3 -type f \\
            \\( -name '*.elf' -o -name '*.elf32' -o -name '*.xex' \\) \\
            -print

          test -s "./$(basename "$PWD").xex"

      - name: Upload Xbox 360 build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xbox360-homebrew
          path: |
            **/*.elf
            **/*.elf32
            **/*.xex
          if-no-files-found: error
