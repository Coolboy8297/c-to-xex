
name: Build Xbox 360 Homebrew

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: free60/libxenon:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Xbox 360 program
        run: |
          export DEVKITXENON=/usr/local/xenon
          export PATH="$DEVKITXENON/bin:$DEVKITXENON/usr/bin:$PATH"

          echo "Cleaning previous build..."
          make clean || true

          echo "Compiling project..."
          make

      - name: Check for XEX conversion tools
        run: |
          echo "Checking for xextool..."
          if command -v xextool >/dev/null 2>&1; then
            xextool -h || true
          else
            echo "xextool is not installed."
          fi

          echo "Checking for other XEX tools..."
          find /usr/local /usr/bin \
            -iname '*xex*' -type f 2>/dev/null | head -50

          echo "Available build outputs:"
          find . -maxdepth 3 -type f \
            \( -name '*.elf' -o -name '*.elf32' -o -name '*.xex' \) \
            -print

      - name: Upload Xbox 360 build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xbox360-homebrew
          path: |
            **/*.elf
            **/*.elf32
            **/*.xex
          if-no-files-found: error
