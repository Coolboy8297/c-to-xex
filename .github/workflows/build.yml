name: Build Xbox 360 Homebrew

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: free60/libxenon:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare XEX packer and linker layout
        shell: bash
        run: |
          set -euo pipefail
          export DEVKITXENON=/usr/local/xenon
          export PATH="$DEVKITXENON/bin:$DEVKITXENON/usr/bin:$PATH"
          if ! command -v python3 >/dev/null 2>&1; then
            if command -v apt-get >/dev/null 2>&1; then
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y python3
            elif command -v apk >/dev/null 2>&1; then
              apk add --no-cache python3
            else
              echo "ERROR: Python 3 is missing and no supported package manager was found."
              exit 1
            fi
          fi
          python3 --version
          git clone --depth 1 https://github.com/Team-Resurgent/RXDK360.git /tmp/RXDK360
          test -f /tmp/RXDK360/tools/elf2xex.py
          # Keep the PE headers in a page before the first linked section.
          sed -i 's/image_base = min(load_vaddrs) if load_vaddrs else None/image_base = (min(load_vaddrs) - 0x1000) if load_vaddrs else None/' /tmp/RXDK360/tools/elf2xex.py
          grep -F 'image_base = (min(load_vaddrs) - 0x1000)' /tmp/RXDK360/tools/elf2xex.py
          sed -e 's|0x80000000|0x82000000|g' \
              -e 's|0x9E000000|0xA0000000|g' \
              -e 's|0xa0000000|0xA2000000|g' \
              "$DEVKITXENON/app.lds" > /tmp/veyaora-app.lds
          cp /tmp/veyaora-app.lds "$DEVKITXENON/app.lds"

      - name: Build and package
        shell: bash
        run: |
          set -euo pipefail
          export DEVKITXENON=/usr/local/xenon
          export PATH="$DEVKITXENON/bin:$DEVKITXENON/usr/bin:$PATH"
          make clean
          make
          ELF="./$(basename "$PWD").elf"
          ELF32="./$(basename "$PWD").elf32"
          XEX="./$(basename "$PWD").xex"
          test -s "$ELF"
          test -s "$ELF32"
          # Package the full ELF: the stripped ELF32 drops the high address bit
          # needed for a correctly based Xbox 360 image.
          python3 /tmp/RXDK360/tools/elf2xex.py "$ELF" --no-sign --no-encrypt -o "$XEX"
          test -s "$XEX"
          file "$ELF" "$ELF32" "$XEX"
          # Fail the build if the packer emits the low 0x02xxxxxx addresses
          # seen in the previous broken artifact.
          python3 - "$ELF" <<'PY'
          import struct, sys
          path = sys.argv[1]
          with open(path, "rb") as f:
              data = f.read(64)
          if data[:4] != b"\x7fELF":
              raise SystemExit("ERROR: expected an ELF input")
          entry = struct.unpack(">I", data[24:28])[0]
          print(f"ELF entry point: 0x{entry:08X}")
          if entry < 0x80000000:
              raise SystemExit("ERROR: ELF entry point is below the Xbox 360 kernel address range")
          PY

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xbox360-homebrew
          path: |
            **/*.elf
            **/*.elf32
            **/*.xex
          if-no-files-found: error
