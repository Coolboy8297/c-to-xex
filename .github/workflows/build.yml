name: Build Xbox 360 Homebrew

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: free60/libxenon:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare XEX packer and linker layout
        shell: bash
        run: |
          set -euo pipefail
          export DEVKITXENON=/usr/local/xenon
          export PATH="$DEVKITXENON/bin:$DEVKITXENON/usr/bin:$PATH"
          if ! command -v python3 >/dev/null 2>&1; then
            if command -v apt-get >/dev/null 2>&1; then
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y python3
            elif command -v apk >/dev/null 2>&1; then
              apk add --no-cache python3
            else
              echo "ERROR: Python 3 is missing and no supported package manager was found."
              exit 1
            fi
          fi
          python3 --version
          git clone --depth 1 https://github.com/Team-Resurgent/RXDK360.git /tmp/RXDK360
          test -f /tmp/RXDK360/tools/elf2xex.py
          sed -i 's/image_base = min(load_vaddrs) if load_vaddrs else None/image_base = (min(load_vaddrs) - 0x1000) if load_vaddrs else None/' /tmp/RXDK360/tools/elf2xex.py
          grep -F 'image_base = (min(load_vaddrs) - 0x1000)' /tmp/RXDK360/tools/elf2xex.py
          sed -e 's|0x80000000|0x82000000|g' \
              -e 's|0x9E000000|0xA0000000|g' \
              -e 's|0xa0000000|0xA2000000|g' \
              "$DEVKITXENON/app.lds" > /tmp/veyaora-app.lds
          cp /tmp/veyaora-app.lds "$DEVKITXENON/app.lds"

      - name: Build and package
        shell: bash
        run: |
          set -euo pipefail
          export DEVKITXENON=/usr/local/xenon
          export PATH="$DEVKITXENON/bin:$DEVKITXENON/usr/bin:$PATH"
          make clean
          make
          ELF="./$(basename "$PWD").elf"
          ELF32="./$(basename "$PWD").elf32"
          XEX="./$(basename "$PWD").xex"
          test -s "$ELF"
          test -s "$ELF32"
          python3 /tmp/RXDK360/tools/elf2xex.py "$ELF" --no-sign --no-encrypt -o "$XEX"
          test -s "$XEX"
          file "$ELF" "$ELF32" "$XEX"
          python3 - "$ELF" <<'PY'
          import struct, sys
          path = sys.argv[1]
          with open(path, "rb") as f:
              data = f.read(64)
          if data[:4] != b"\x7fELF":
              raise SystemExit("ERROR: expected an ELF input")
          entry = struct.unpack(">I", data[24:28])[0]
          print(f"ELF entry point: 0x{entry:08X}")
          if entry < 0x80000000:
              raise SystemExit("ERROR: ELF entry point is below the Xbox 360 kernel address range")
          PY
          mkdir -p release-files
          cp "$ELF" release-files/xbox360-homebrew.elf
          cp "$ELF32" release-files/xbox360-homebrew.elf32
          cp "$XEX" release-files/xbox360-homebrew.xex
          cd release-files
          sha256sum * > SHA256SUMS.txt

      - name: Upload build artifacts for maintainers
        uses: actions/upload-artifact@v4
        with:
          name: xbox360-homebrew
          path: release-files/*
          if-no-files-found: error

      - name: Publish direct downloads for website visitors
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="latest-build"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-files/* --clobber
            gh release edit "$TAG" --title "Latest Xbox 360 build" --notes "Automatically updated from the latest successful build on the default branch. Direct downloads are also linked from the project website."
          else
            gh release create "$TAG" release-files/* --title "Latest Xbox 360 build" --notes "Automatically updated from successful builds on the default branch. Direct downloads are also linked from the project website." --prerelease
          fi
